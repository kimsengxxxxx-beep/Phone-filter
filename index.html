<!DOCTYPE html><html lang="km"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ច្រោះលេខទូរស័ព្ទ</title><style>body{font-family:sans-serif;background:#f3f4f6;padding:15px;margin:0;color:#1f2937}.card{max-width:600px;margin:auto;background:#fff;padding:18px;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.08)}h2{margin-top:0;font-size:18px;text-align:center}textarea{width:100%;height:110px;padding:10px;border:1.5px solid #d1d5db;border-radius:10px;box-sizing:border-box;font-size:14px}.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}button{flex:1;min-width:110px;padding:10px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;font-size:13px}.btn-primary{background:#2563eb;color:#fff}.btn-green{background:#10b981;color:#fff}.btn-gray{background:#e5e7eb;color:#374151}.btn-red{background:#ef4444;color:#fff}.options{margin:10px 0;font-size:14px;display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.item{background:#f9fafb;border:1.5px solid #e5e7eb;padding:10px;border-radius:8px;text-align:center;font-weight:bold;font-size:15px;cursor:pointer;user-select:none}.item.copied{background:#dcfce7;border-color:#22c55e;color:#15803d}</style></head><body><div class="card"><h2>📱 កម្មវិធីច្រោះលេខទូរស័ព្ទ</h2><textarea id="input" placeholder="Paste អត្ថបទពី Telegram ចូលទីនេះ..."></textarea><div class="options"><label><input type="checkbox" id="unique" checked> លុបលេខស្ទួន</label><span id="count">សរុប៖ 0 លេខ</span></div><div class="btns"><button class="btn-primary" id="btnExtract">ច្រោះយកលេខ</button><button class="btn-green" id="btnTxt">ទាញយក .txt</button><button class="btn-gray" id="btnCopyAll">Copy ទាំងអស់</button><button class="btn-gray" id="btnReset">សម្អាត ✅</button><button class="btn-red" id="btnClear">សម្អាតទាំងអស់</button></div><div id="list" class="grid"></div></div><script>(function(){const inputEl=document.getElementById("input"),uniqueEl=document.getElementById("unique"),listEl=document.getElementById("list"),countEl=document.getElementById("count");let copiedSet=new Set(JSON.parse(localStorage.getItem("copied_phones")||"[]")),extractedNumbers=[];function copyText(t){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).catch(function(){fallbackCopy(t)})}else{fallbackCopy(t)}}function fallbackCopy(t){const ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta)}function extract(){const lines=inputEl.value.split(/\r?\n/);let results=[];lines.forEach(function(line){let cleaned=line.replace(/^\s*\d+\s*[-–—.):]\s*/,"");let matches=cleaned.match(/(?:\+855|0)[1-9]\d{7,8}/g);if(matches)results.push.apply(results,matches)});if(uniqueEl.checked)results=Array.from(new Set(results));extractedNumbers=results;render()}function render(){countEl.textContent="សរុប៖ "+extractedNumbers.length+" លេខ";listEl.innerHTML="";extractedNumbers.forEach(function(num){const div=document.createElement("div"),isCopied=copiedSet.has(num);div.className="item"+(isCopied?" copied":"");div.textContent=isCopied?(num+" ✅"):num;div.onclick=function(){copyText(num);copiedSet.add(num);localStorage.setItem("copied_phones",JSON.stringify(Array.from(copiedSet)));render()};listEl.appendChild(div)})}inputEl.value=localStorage.getItem("saved_text")||"";uniqueEl.checked=localStorage.getItem("saved_unique")!=="false";extract();inputEl.addEventListener("input",function(){localStorage.setItem("saved_text",inputEl.value);extract()});uniqueEl.addEventListener("change",function(){localStorage.setItem("saved_unique",uniqueEl.checked);extract()});document.getElementById("btnExtract").onclick=extract;document.getElementById("btnCopyAll").onclick=function(){if(!extractedNumbers.length)return;copyText(extractedNumbers.join("\n"));alert("បាន Copy លេខទាំងអស់រួចរាល់!")};document.getElementById("btnTxt").onclick=function(){if(!extractedNumbers.length)return;const blob=new Blob([extractedNumbers.join("\n")],{type:"text/plain;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="phone_numbers.txt";a.click()};document.getElementById("btnReset").onclick=function(){copiedSet.clear();localStorage.removeItem("copied_phones");render()};document.getElementById("btnClear").onclick=function(){inputEl.value="";copiedSet.clear();localStorage.removeItem("saved_text");localStorage.removeItem("copied_phones");extract()}})();</script></body></html>
